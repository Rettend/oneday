name = "oneday-agent"
main = "src/server.ts"
compatibility_date = "2025-01-01"
compatibility_flags = [ "nodejs_compat" ]

[ai]
binding = "AI"

[observability]
enabled = true

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true

[[durable_objects.bindings]]
name = "ChatAgent"
class_name = "ChatAgent"

[[migrations]]
tag = "v1"
new_sqlite_classes = [ "ChatAgent" ]
